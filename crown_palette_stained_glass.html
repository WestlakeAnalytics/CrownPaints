<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Better Together</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#f5f1e9; --ink:#23201c; --muted:#6f685e; --line:#ddd5c6; --card:#fffdf8; --accent:#23201c;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){ --paper:#17150f; --ink:#f1ece1; --muted:#9d9588; --line:#34302a; --card:#1f1c16; --accent:#f1ece1; }
}
:root[data-theme="dark"]{ --paper:#17150f; --ink:#f1ece1; --muted:#9d9588; --line:#34302a; --card:#1f1c16; --accent:#f1ece1; }
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 "Segoe UI",system-ui,-apple-system,sans-serif}
header{padding:28px 24px 12px;max-width:1700px;margin:0 auto}
h1{font:600 28px/1.15 Georgia,"Times New Roman",serif;margin:0 0 4px;letter-spacing:.2px}
header p{margin:0;color:var(--muted);max-width:75ch}
.controls{display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;padding:14px 24px;max-width:1700px;margin:0 auto}
.controls input[type=search]{padding:8px 12px;border:1px solid var(--line);border-radius:20px;background:var(--card);color:var(--ink);min-width:220px;font:inherit}
.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chips b{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-right:4px;font-weight:600}
.chip{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:16px;padding:3px 11px;font:inherit;font-size:13px;cursor:pointer}
.chip[aria-pressed=true]{background:var(--accent);color:var(--paper);border-color:var(--accent)}
.clear{background:none;border:0;color:var(--muted);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px}
.opt{font-size:13px;color:var(--muted);display:flex;gap:6px;align-items:center;cursor:pointer}
main{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:20px;padding:0 24px 40px;max-width:1700px;margin:0 auto;align-items:start}
svg#grid{width:100%;height:auto;display:block}
#tip{position:fixed;pointer-events:none;background:var(--ink);color:var(--paper);padding:6px 10px;border-radius:8px;font-size:12.5px;max-width:260px;z-index:9;display:none}
#tip b{display:block;font-size:13.5px}
aside{position:sticky;top:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;max-height:calc(100vh - 28px);overflow:auto}
aside .empty{color:var(--muted)}
.big{height:150px;margin:-4px -4px 14px}
.big svg{width:100%;height:100%}
/* detail body: a column that always fits its box. The colour blob is the flexible part and shrinks first. */
.pbody{display:flex;flex-direction:column;--s:1}
.pbody>*{flex:none}
.phead{display:flex;align-items:center;gap:12px;padding-right:38px;margin:0 0 4px}
.phead .big{flex:0 0 60px;width:60px;height:60px;margin:0}
.phead .ptitle{min-width:0}
.phead h2{font-size:22px;line-height:1.15;margin:0}
.phead .hex{line-height:1.2}
.pbody.c1 .long{display:none}
.pbody.c2 .sims,.pbody.c2 .simh{display:none}
.pbody.c3 .tags{display:none}
/* splodge swatches */
.sw{border:0!important;border-radius:var(--br,50%)!important;background-image:radial-gradient(circle at 30% 24%,rgba(255,255,255,.5),rgba(255,255,255,0) 55%);box-shadow:0 1px 2px rgba(0,0,0,.2),inset 0 -3px 6px rgba(0,0,0,.08)}
.pbody .pair .sw{flex:0 0 42px;width:42px;height:42px}
.pbody .sims .sw{width:46px;height:46px;margin:0 auto 3px}
.pbody>.big svg{max-height:100%}
aside h2{font:600 24px/1.2 Georgia,serif;margin:0 0 2px}
.hex{font-family:Consolas,monospace;color:var(--muted);font-size:13px}
.tags{display:flex;flex-wrap:wrap;gap:5px;margin:8px 0 10px}
.tag{font-size:11.5px;border:1px solid var(--line);border-radius:10px;padding:1px 8px;color:var(--muted)}
aside h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:16px 0 6px}
.short{font-weight:600;margin:6px 0}
.long{color:var(--muted);margin:0}
.pair{display:flex;gap:10px;align-items:center;padding:6px;border-radius:10px;cursor:pointer;border:0;background:none;width:100%;text-align:left;color:inherit;font:inherit}
.pair:hover{background:var(--paper)}
.pair[disabled]{cursor:default}
.sw{display:block;flex:0 0 38px;height:38px;border-radius:8px;border:1px solid var(--line)}
.pair small{display:block;color:var(--muted);line-height:1.3;font-size:12px}
.sims{display:flex;flex-wrap:wrap;gap:6px}
.sims{align-items:flex-start}
.sims button{border:0;background:none;padding:0;cursor:pointer;text-align:center;width:56px;font:inherit;color:inherit;font-size:10.5px;line-height:1.2;display:flex;flex-direction:column;justify-content:flex-start;align-items:stretch}   /* swatches share a top line however many lines the label takes */
.sims button[disabled]{cursor:default}
.sims .sw{display:block;margin-bottom:2px;width:56px;height:34px;flex:none}
.stat{font-size:13px;color:var(--muted);margin-top:12px}
a.crown{display:inline-block;margin-top:12px;color:var(--ink);font-size:13px}
.note{color:var(--muted);font-size:12.5px;max-width:1700px;margin:0 auto;padding:0 24px 40px}
.dim{opacity:.14}
aside .close{position:absolute;top:10px;right:12px;width:30px;height:30px;border:1px solid var(--line);border-radius:50%;background:var(--card);color:var(--ink);font-size:18px;line-height:1;cursor:pointer;z-index:2}
aside .close:hover{background:var(--paper)}
@media (max-width:980px){ main{grid-template-columns:1fr} aside{position:static;max-height:none} }

.cell{cursor:pointer;transition:opacity .25s}
.cell .body{stroke:var(--paper);stroke-width:3;stroke-linejoin:round}
.cell:hover .body{filter:brightness(1.08) saturate(1.12)}
.cell .shine{pointer-events:none}
.cell text{pointer-events:none;font-family:"Segoe UI",system-ui,sans-serif;font-weight:600;text-anchor:middle;display:none}
.cell.lbl text,body.all-labels .cell text,.cell.show text{display:block}
body.labels-off .cell text{display:none!important}
/* hovering a partner or similar colour in the details lights its splodge up, even if it was dimmed */
.cell.hl{opacity:1!important}
.cell.hl .body{stroke:#d9901a;stroke-width:5;filter:drop-shadow(0 3px 6px rgba(0,0,0,.4))}
body.labels-off .cell.hl text{display:block!important}
.ring .body{stroke:var(--ink);stroke-width:3.4}
.sel .body{stroke:#d9901a;stroke-width:4.4}
#links{filter:url(#brush) drop-shadow(0 0 1.2px rgba(40,34,28,.55))}   /* a fine dark edge keeps pale colours visible on the beige */
#links path{opacity:.95;pointer-events:none}
#links path.bristle{fill:none;stroke-width:1;stroke-linecap:round;opacity:.5}
.side{position:relative;align-self:stretch;display:flex;flex-direction:column}   /* as tall as the picture */
.side .filters{flex:1}
.filters{position:relative;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:14px}
.filters .chips b{flex:0 0 100%;margin:0 0 2px}
.filters input[type=search]{width:100%;min-width:0;padding:8px 14px;border:1px solid var(--line);border-radius:20px;background:var(--paper);color:var(--ink);font:inherit}
.filters .clear{align-self:flex-start}
.filters aside{position:static;max-height:none;overflow:visible}
.filters aside:not(.open){background:none;border:0;border-radius:0;padding:0}
.filters aside:not(.open) p{margin:0}
.filters aside.open{position:absolute;top:-1px;left:-1px;right:-1px;z-index:5;max-height:calc(100vh - 28px);overflow:auto;box-shadow:0 6px 24px rgba(0,0,0,.12)}
.hero{text-align:center;max-width:none;padding:20px 24px 6px}
.hero h1 .ch{display:inline-block;padding:.2em .26em;margin:-.2em -.26em;color:var(--c);-webkit-text-fill-color:transparent;-webkit-background-clip:text;background-clip:text;
  background-image:radial-gradient(circle at 30% 22%,rgba(255,255,255,.6),rgba(255,255,255,0) 52%),linear-gradient(var(--c),var(--c));
  filter:drop-shadow(0 2px 1.5px rgba(0,0,0,.2))}
.hero h1 .sp{display:inline-block;width:.28em}
.hero h1{font:700 min(132px,13vw)/1.2 Caveat,"Segoe Print","Bradley Hand","Comic Sans MS",cursive;letter-spacing:.01em;margin:0 0 2px}   /* a fixed size on any normal screen */
/* the circle is sized from the window height so title, circle and footer fit on one screen;
   the circle and the side box sit together in the middle */
main{grid-template-columns:auto 360px;justify-content:center;column-gap:36px;align-items:stretch;padding:4px 24px 6px}
svg#grid{width:min(max(300px,calc(100vh - 312px)),calc(100vw - 480px));height:auto}
.site-foot{padding:2px 24px 12px}
@media (min-width:981px){
  .filters{position:absolute;inset:0;overflow-y:auto}   /* the box never lengthens the row; it scrolls inside if the window is short */
  /* the details cover the whole box exactly: no scrollbars, the content is fitted inside */
  .filters:has(aside.open){overflow:hidden}   /* the search and filters underneath must not show a scrollbar behind the details */
  .filters aside.open{top:-1px;left:-1px;right:-1px;bottom:-1px;max-height:none;overflow:hidden}
  .filters aside.open .pbody{width:calc(100% / var(--s));height:calc(100% / var(--s));transform:scale(var(--s));transform-origin:0 0;overflow:hidden}
}
@media (max-width:980px){
  main{grid-template-columns:1fr}
  svg#grid{width:100%}
  .hero h1{font-size:clamp(52px,14vw,96px)}
}
/* ---- the search and filter box is hidden until asked for ---- */
.hero{position:relative}
.burger{position:absolute;right:24px;bottom:4px;width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--card);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4.5px;padding:0;box-shadow:0 1px 4px rgba(0,0,0,.06)}
.burger:hover{background:var(--paper)}
.burger{transition:opacity .3s ease,visibility 0s}
body.has-sel .burger{opacity:0;visibility:hidden;pointer-events:none;transition:opacity .3s ease,visibility 0s linear .3s}   /* hidden while a colour is selected */
.burger span{display:block;width:18px;height:2px;border-radius:2px;background:var(--ink);transition:transform .35s,opacity .25s}
.burger[aria-expanded=true] span:nth-child(1){transform:translateY(6.5px) rotate(45deg)}
.burger[aria-expanded=true] span:nth-child(2){opacity:0}
.burger[aria-expanded=true] span:nth-child(3){transform:translateY(-6.5px) rotate(-45deg)}
@media (min-width:981px){
  :root{--c:min(max(300px,calc(100vh - 312px)),calc(100vw - 480px));--w:360px;--gap:36px}
  /* the burger sits just above the top right corner of the menu, and stays put whether the menu is open or not */
  .burger{right:auto;bottom:2px;left:calc(50% + var(--c)/2 + (var(--w) + var(--gap))/2 - 46px)}
  main{display:flex;justify-content:center;align-items:flex-start;position:relative}
  .stage{flex:none;transition:transform .55s cubic-bezier(.22,.8,.2,1)}
  svg#grid{width:var(--c);height:auto}
  .side{position:absolute;top:4px;width:var(--w);height:var(--c);align-self:auto;
    left:calc(50% + var(--c)/2 + var(--gap) - (var(--w) + var(--gap))/2);
    opacity:0;visibility:hidden;transform:translateX(80px);
    transition:opacity .4s ease,transform .55s cubic-bezier(.22,.8,.2,1),visibility 0s linear .55s}
  body.side-open .stage{transform:translateX(calc(-1 * (var(--w) + var(--gap)) / 2))}
  body.side-open .side{opacity:1;visibility:visible;transform:none;transition:opacity .4s ease .1s,transform .55s cubic-bezier(.22,.8,.2,1),visibility 0s}
}
@media (max-width:980px){
  body:not(.side-open) .side{display:none}
  .filters aside.open{position:static;max-height:none;overflow:visible;box-shadow:none;border:0;padding:0}
  .filters:has(aside.open)>:not(aside){display:none}
  .pbody>.big{flex:none;height:150px}
  .burger{bottom:2px;right:14px}
}
@media (prefers-reduced-motion:reduce){ .stage,.side,.burger span{transition:none!important} }
.hero p{margin:10px auto 0;max-width:none;font-size:15px}
.hero p span{display:block}
:root{--title:#3b4a5b}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--title:#a9bbd0}}
.site-foot{max-width:1700px;margin:0 auto;padding:6px 24px 18px;text-align:right;font-size:11.5px;color:var(--muted);opacity:.8}
.site-foot a{color:inherit}
@media (max-width:980px){ .side{position:relative;top:0} }
</style>
</head>
<body>
<header class="hero">
  <h1 id="title" aria-label="Better Together">Better Together</h1>
  <p><span>194 paint colours, arranged so the ones that <em>go well together</em> sit side by side.</span><span>Click a colour to explore.</span></p>
  <button class="burger" id="burger" aria-label="Search and filter colours" aria-expanded="false" aria-controls="side"><span></span><span></span><span></span></button>
</header>
<main>
  <div class="stage"><svg id="grid" role="img" aria-label="Stained glass window of Crown paint colours"><defs><radialGradient id="shine" cx=".3" cy=".25" r=".9"><stop offset="0" stop-color="#fff" stop-opacity=".28"/><stop offset=".6" stop-color="#fff" stop-opacity="0"/><stop offset="1" stop-color="#000" stop-opacity=".14"/></radialGradient><filter id="brush" x="-5%" y="-5%" width="110%" height="110%"><feTurbulence type="fractalNoise" baseFrequency="0.09" numOctaves="2" seed="3" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="2.6" xChannelSelector="R" yChannelSelector="G"/></filter></defs><g id="tiles"></g><g id="links" filter="url(#brush)"></g></svg></div>
  <div class="side" id="side">
    <div class="filters">
      <input type="search" id="q" placeholder="Search colours…" aria-label="Search colours">
      <div class="chips" id="toneChips"><b>Tone</b></div>
      <div class="chips" id="hueChips"><b>Hue</b></div>
      <aside id="panel"></aside>
      <button class="clear" id="clear">Clear</button>
      <div hidden>
        <select id="labelMode"><option value="off" selected>Off</option><option value="fit">Where they fit</option><option value="all">All</option></select>
        <input type="range" id="round" min="0" max="1" step="0.05" value="1">
        <input type="range" id="gap" min="0" max="0.35" step="0.01" value="0.0875">
      </div>
    </div>
  </div>
</main>
<footer class="site-foot">paint colours from <a href="https://www.crownpaints.com" target="_blank" rel="noopener">CrownPaints.com</a> | design by Chris Westlake</footer>

<script>
// ---------- shared helpers
const hexToRgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
const lum=h=>{const [r,g,b]=hexToRgb(h).map(v=>{v/=255;return v<=.03928?v/12.92:Math.pow((v+.055)/1.055,2.4)});return .2126*r+.7152*g+.0722*b};
const textOn=h=>lum(h)>.42?'#23201c':'#ffffff';
function hsl(h){let [r,g,b]=hexToRgb(h).map(v=>v/255);const mx=Math.max(r,g,b),mn=Math.min(r,g,b),l=(mx+mn)/2;let H=0,S=0;if(mx!==mn){const d=mx-mn;S=l>.5?d/(2-mx-mn):d/(mx+mn);H=mx===r?(g-b)/d+(g<b?6:0):mx===g?(b-r)/d+2:(r-g)/d+4;H*=60}return [H,S,l]}
function rng(seed){return()=>{seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const NS='http://www.w3.org/2000/svg';

    g.classList.toggle('dim',dim);g.classList.toggle('sel',i===st.selected);g.classList.toggle('ring',comp.has(i));g.classList.toggle('show',i===st.selected||comp.has(i))});
  if(st.selected>=0)[...comp,st.selected].forEach(i=>tilesG.appendChild(nodes[i]));
  linksG.innerHTML='';svg.querySelectorAll('linearGradient.lnk').forEach(g=>g.remove());gradN=0;
  if(st.selected>=0)[...comp].forEach((b,k)=>brushStroke(cen[st.selected],cen[b],st.selected*31+b+k,DATA[st.selected].h,DATA[b].h));
}
const ui=initUI({noun:'pane',onChange:refresh,
  onHover:i=>{nodes.forEach(g=>g.classList&&g.classList.remove('hl'));if(i>=0&&nodes[i]&&nodes[i].classList){nodes[i].classList.add('hl');tilesG.appendChild(nodes[i])}},
  preview:i=>{const poly=polys[i],c=cen[i];if(poly.length<3)return '';const s=58/Math.max(Math.sqrt(c.area/Math.PI),1);
    const pts=blended(i).map(p=>[(p[0]-c.x)*s,(p[1]-c.y)*s]);
    return `<svg viewBox="-75 -75 150 150"><path d="${rpath(pts,.5*ROUND)}" fill="${DATA[i].h}" stroke="rgba(0,0,0,.12)" stroke-width="1.5"/></svg>`},
  touching:i=>{const l=DATA[i].g.filter(r=>r.i>=0);return {n:l.filter(r=>nbr[i].has(r.i)).length,of:l.length,extra:`Recommended by ${pop[i]} other colour${pop[i]===1?'':'s'}; sits beside ${nbr[i].size} panes in total.`}}});
const tch=best.sc;
// title: every letter is filled with a glossy Crown colour, sweeping through the hues left to right
{const h=document.getElementById('title'),txt=h.textContent,
  pick=[...Array(N).keys()].filter(i=>{const [,s,l]=hsl(DATA[i].h);return s>.2&&l>.22&&l<.56}).sort((a,b)=>hsl(DATA[a].h)[0]-hsl(DATA[b].h)[0]),
  letters=[...txt].filter(c=>c!==' ').length;let k=0;
  h.textContent='';
  [...txt].forEach(c=>{const s=document.createElement('span');
    if(c===' '){s.className='sp'}else{s.className='ch';s.setAttribute('aria-hidden','true');s.style.setProperty('--c','var(--title)');k++}
    s.textContent=c===' '?' ':c;h.appendChild(s)});}
ui.select(-1);window.__layout={touching:tch,pairs:edges.length};
})();
